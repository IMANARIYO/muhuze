[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aiosmtplib>=5.1.2",
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "cloudinary>=1.46.0",
    "fastapi[standard]>=0.141.1",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "sqlalchemy>=2.0.52",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Keep async tests on one event loop for the whole session: the SQLAlchemy
# async engine is a module-level singleton, and its pooled connections break
# (esp. on Windows' ProactorEventLoop) if reused across a different loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff.lint]
# B008: FastAPI's `Depends()` default-argument pattern is intentional, not a bug.
ignore = ["B008"]
